services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      ABUSEIPDB_API_KEY_FILE: /run/secrets/abuseipdb_api_key
      VIRUSTOTAL_API_KEY_FILE: /run/secrets/virustotal_api_key
    secrets:
      - db_password
      # API key sumber reputasi hanya untuk api (bukan db). File sumbernya harus ada agar
      # `docker compose up` jalan, walau mode mock (boleh kosong): lihat README.
      - abuseipdb_api_key
      - virustotal_api_key
    volumes:
      # KHUSUS DEV/TEST: dibaca tests/test_env_example.py. Jangan disalin ke compose
      # produksi (soc-ir): di sana tidak ada alasan membawa .env.example ke kontainer.
      # Mount satu file menyimpan inode-nya: setelah .env.example diubah (edit, git pull),
      # jalankan `docker compose up -d --force-recreate api` agar kontainer melihat isi baru.
      - ./.env.example:/app/.env.example:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

secrets:
  db_password:
    file: ./secrets/db_password.txt
  abuseipdb_api_key:
    file: ./secrets/abuseipdb_api_key.txt
  virustotal_api_key:
    file: ./secrets/virustotal_api_key.txt

volumes:
  db_data:

networks:
  internal:
